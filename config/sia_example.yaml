robot:
  urdf_path: examples/sia/sia_v3_urdf.urdf
  dof: 6
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]

recording:
  joint_state_topic: /joint_state_broadcaster/joint_states
  estimate_joint_state_topic: /joint_states
  duration_sec: 30.0
  shutdown_on_finish: true

identification:
  stride: 50
  max_samples: 1200
  selection_samples: 400
  chunk_size: 200

codegen:
  export_code: true
  languages: [c, cpp]
